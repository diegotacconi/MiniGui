name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout    
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup DotNet
      - uses: actions/setup-dotnet@v4
        with:
         dotnet-version: '6.0.x'

      - name: Build and Package
        run: dotnet build MiniGui.sln -c Release

      - name: Upload
      - uses: actions/upload-artifact@v4
        with:
          name: MiniGui-TapPackage
          retention-days: 5          
          path: bin/Release/net472/*.TapPackage
