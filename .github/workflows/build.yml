name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and package
        run: dotnet build MiniGui.sln -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: MiniGui-TapPackage
          path: MiniGui/bin/Release/net472/*.TapPackage
