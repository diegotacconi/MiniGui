name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and package
        run: dotnet build MiniGui.sln -c Release

      - name: Verify tap command discovery
        shell: pwsh
        run: |
          $help = & .\bin\Release\net472\tap.exe minigui --help 2>&1 | Out-String
          if ($help -notmatch 'Usage: minigui') { Write-Output $help; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MiniGui-TapPackage
          path: bin/Release/net472/*.TapPackage
